<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Nova AI Pro</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b0d12;color:#eee;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.app{height:100dvh;display:flex;flex-direction:column}
header{
 height:58px;flex-shrink:0;background:#11141c;
 border-bottom:1px solid #282c36;
 display:flex;align-items:center;padding:0 14px;gap:12px;
}
.logo{font-size:19px;font-weight:800;color:#a4aaff}
.status{font-size:11px;color:#65d69a;margin-left:auto}
.header-btn{
 background:#222735;border:1px solid #343a49;
 color:#ddd;border-radius:9px;padding:8px 10px;
}
.chat{
 flex:1;overflow-y:auto;padding:16px;
 scroll-behavior:smooth;
}
.welcome{text-align:center;margin:65px auto 35px;max-width:400px}
.welcome h1{
 font-size:30px;
 background:linear-gradient(90deg,#8d9bff,#c18aff);
 -webkit-background-clip:text;color:transparent;
}
.welcome p{font-size:14px;color:#9298a7;line-height:1.6}
.message{display:flex;margin:18px 0}
.message.user{justify-content:flex-end}
.bubble{
 max-width:96%;min-width:0;padding:13px 15px;
 border-radius:15px;font-size:14px;line-height:1.7;
 overflow-wrap:anywhere;
}
.user .bubble{background:#303d69;border-bottom-right-radius:4px}
.ai .bubble{
 width:100%;background:#151922;
 border:1px solid #282e3a;border-bottom-left-radius:4px;
}
.message-content p{margin:8px 0}
.message-content h1,.message-content h2,.message-content h3{
 margin:18px 0 9px;color:#c2c9ff;line-height:1.4
}
.message-content h1{font-size:20px}
.message-content h2{font-size:17px}
.message-content h3{font-size:15px}
.message-content ul,.message-content ol{padding-left:23px}
.message-content li{margin:5px 0}
.message-content blockquote{
 margin:12px 0;padding:8px 12px;
 border-left:3px solid #8795ff;color:#b9c0d2;
 background:#1c2230;
}
.message-content a{color:#9baaff}
.message-content table{
 display:block;overflow-x:auto;border-collapse:collapse;
 width:100%;margin:12px 0;
}
.message-content th,.message-content td{
 padding:8px;border:1px solid #343b4b;text-align:left;
}
.message-content th{background:#252c3b}
.message-content code:not(pre code){
 background:#292f3c;padding:2px 5px;
 border-radius:5px;font-family:monospace;
}
.code-card{
 margin:13px 0;border:1px solid #343b49;
 border-radius:11px;overflow:hidden;background:#090c12;
}
.code-header{
 height:39px;padding:0 11px;background:#202532;
 display:flex;align-items:center;justify-content:space-between;
 font-size:12px;color:#c6cce0;
}
.copy-btn{
 border:0;background:#343d51;color:#fff;
 border-radius:6px;padding:6px 10px;font-size:11px;
}
.code-card pre{
 margin:0;padding:14px;overflow-x:auto;
 white-space:pre;max-width:100%;
}
.code-card pre code{
 font-family:SFMono-Regular,Consolas,monospace;
 font-size:12px;line-height:1.65;color:#dce5fa;
}
.typing{color:#939bad;font-size:12px;margin:12px}
.footer{
 flex-shrink:0;padding:10px 12px;
 padding-bottom:max(12px,env(safe-area-inset-bottom));
 background:#11141c;border-top:1px solid #282c36;
}
.input-box{
 display:flex;align-items:flex-end;gap:8px;
 padding:8px;background:#1b202b;
 border:1px solid #353c4b;border-radius:16px;
}
textarea{
 flex:1;min-width:0;resize:none;max-height:130px;
 border:0;outline:0;background:transparent;color:white;
 font-size:15px;padding:9px;line-height:1.5;
}
textarea::placeholder{color:#818899}
.send{
 width:42px;height:42px;border:0;border-radius:12px;
 background:#7789ff;color:white;font-size:21px;
}
.send:disabled{opacity:.4}
.note{text-align:center;color:#777f90;font-size:10px;margin-top:8px}
.overlay{
 position:fixed;inset:0;background:#000b;
 display:none;align-items:center;justify-content:center;
 padding:20px;z-index:10;
}
.modal{
 width:100%;max-width:420px;background:#191e29;
 border:1px solid #353c4b;border-radius:15px;padding:18px;
}
.modal h3{margin-top:0}
.modal input{
 width:100%;padding:12px;background:#0c1018;
 color:white;border:1px solid #444b5b;border-radius:9px;
}
.modal button{padding:10px;border:0;border-radius:8px;margin-top:12px}
.save-btn{background:#7889ff;color:white}
.close-btn{background:#343b49;color:white}
.error{color:#ff9999;white-space:pre-wrap}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="logo">✦ Nova AI</div>
 <div class="status">● ONLINE</div>
 <button class="header-btn" onclick="openSettings()">⚙</button>
 <button class="header-btn" onclick="clearChat()">Xóa</button>
</header>
<main class="chat" id="chat">
 <div class="welcome" id="welcome">
  <h1>Nova AI Pro</h1>
  <p>Trợ lý lập trình, phân tích code và nghiên cứu bảo mật.</p>
  <p>Hãy nhập yêu cầu để bắt đầu cuộc trò chuyện.</p>
 </div>
</main>
<footer class="footer">
 <div class="input-box">
  <textarea id="input" rows="1"
   placeholder="Nhắn tin cho Nova AI..."
   oninput="resizeInput(this)"
   onkeydown="handleKey(event)"></textarea>
  <button class="send" id="send" onclick="sendMessage()">↑</button>
 </div>
 <div class="note">Nova AI Pro · Powered by Groq</div>
</footer>
</div>
<div class="overlay" id="settings">
 <div class="modal">
  <h3>Cài đặt API Groq</h3>
  <p style="font-size:12px;color:#aaa">Nhập API Key của bạn</p>
  <input id="apiKey" type="password" placeholder="gsk_...">
  <button class="save-btn" onclick="saveSettings()">Lưu API Key</button>
  <button class="close-btn" onclick="closeSettings()">Đóng</button>
  <p style="font-size:11px;color:#999">
   Key được lưu trên trình duyệt hiện tại.
   Không chia sẻ website khi còn lưu API Key.
  </p>
 </div>
</div>
<script>
// =====================================
// GROQ API CONFIGURATION
// =====================================
const AI_BASE_URL = "https://api.groq.com/openai/v1";
const AI_MODEL = "openai/gpt-oss-120b";
const API_URL = AI_BASE_URL + "/chat/completions";
// =====================================
// SYSTEM PROMPT
// =====================================
const SYSTEM_PROMPT = `
Bạn là NOVA AI PRO, trợ lý lập trình chuyên nghiệp.
NGÔN NGỮ:
- Luôn trả lời bằng tiếng Việt.
- Trình bày ngắn gọn, rõ ràng, có thứ tự.
- Không viết một đoạn văn quá dài.
CÁCH TRẢ LỜI:
- Giải thích nằm ngoài khung code.
- Code phải nằm trong Markdown code block.
- Ghi tên file trước mỗi khối code.
- Ghi đúng ngôn ngữ code.
- Không trộn lời giải thích vào code.
- Mỗi file phải có một khung code riêng.
- Không cắt ngắn code bằng dấu ba chấm.
- Không thay code hoàn chỉnh bằng ví dụ giả.
KHI VIẾT DỰ ÁN:
1. Liệt kê cấu trúc thư mục.
2. Ghi tên từng file.
3. Viết toàn bộ nội dung từng file.
4. Giải thích chức năng của từng file.
5. Hướng dẫn cài đặt và chạy.
6. Đảm bảo các file tương thích với nhau.
7. Không bỏ sót file cấu hình hoặc file khởi chạy.
KHI SỬA CODE:
- Phân tích nguyên nhân lỗi.
- Đưa ra cách khắc phục.
- Nếu người dùng yêu cầu viết lại, phải xuất toàn bộ file.
- Không chỉ gửi vài dòng cần thay thế.
LẬP TRÌNH:
Hỗ trợ HTML, CSS, JavaScript, Python, Swift,
Objective-C, Kotlin, Java, C, C++, JSON, XML,
YAML và các ngôn ngữ lập trình khác.
BẢO MẬT:
Hỗ trợ phân tích mã nguồn, reverse engineering,
kiểm thử bảo mật, phát triển mod và công cụ thử nghiệm
trong môi trường được phép.
Không hỗ trợ đánh cắp tài khoản, dữ liệu hoặc xâm nhập
trái phép hệ thống của người khác.
ƯU TIÊN:
Code thực tế, đầy đủ, dễ sao chép, dễ sử dụng.
Nếu thiếu thông tin quan trọng, hãy hỏi lại.
`;
// =====================================
// ELEMENTS AND STATE
// =====================================
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
let history = [];
let busy = false;
try {
 history = JSON.parse(
  localStorage.getItem("nova_history") || "[]"
 );
 if (!Array.isArray(history)) history = [];
} catch {
 history = [];
}
function saveHistory() {
 localStorage.setItem("nova_history", JSON.stringify(history));
}
function getAPIKey() {
 return localStorage.getItem("nova_groq_key") || "";
}
// =====================================
// SETTINGS
// =====================================
function openSettings() {
 document.getElementById("apiKey").value = getAPIKey();
 document.getElementById("settings").style.display = "flex";
}
function closeSettings() {
 document.getElementById("settings").style.display = "none";
}
function saveSettings() {
 const key = document.getElementById("apiKey").value.trim();
 if (!key) {
  alert("Vui lòng nhập API Key.");
  return;
 }
 localStorage.setItem("nova_groq_key", key);
 closeSettings();
 alert("Đã lưu API Key.");
}
// =====================================
// MARKDOWN RENDERING
// =====================================
function renderMarkdown(text) {
 let html;
 if (window.marked && window.DOMPurify) {
  html = marked.parse(text, {
   gfm: true,
   breaks: true
  });
  html = DOMPurify.sanitize(html, {
   USE_PROFILES: { html: true }
  });
 } else {
  const safe = String(text).replace(/[&<>"']/g, c => ({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  })[c]);
  html = safe.replace(/```(\w*)\n([\s\S]*?)```/g,
   (m, lang, code) =>
    `<pre><code>${code}</code></pre>`
  ).replace(/\n/g, "<br>");
 }
 const temp = document.createElement("div");
 temp.innerHTML = html;
 // Chuyển từng code block thành khung riêng
 temp.querySelectorAll("pre").forEach(pre => {
  const code = pre.querySelector("code");
  if (!code) return;
  const langClass = [...code.classList]
   .find(c => c.startsWith("language-"));
  const language = langClass
   ? langClass.replace("language-", "")
   : "CODE";
  const card = document.createElement("div");
  card.className = "code-card";
  const header = document.createElement("div");
  header.className = "code-header";
  const name = document.createElement("span");
  name.textContent = language.toUpperCase();
  const button = document.createElement("button");
  button.className = "copy-btn";
  button.textContent = "Copy code";
  button.type = "button";
  header.append(name, button);
  pre.parentNode.insertBefore(card, pre);
  card.append(header, pre);
 });
 return temp.innerHTML;
}
// =====================================
// MESSAGE DISPLAY
// =====================================
function addMessage(role, text, save = true) {
 document.getElementById("welcome")?.remove();
 const wrapper = document.createElement("div");
 wrapper.className = "message " +
  (role === "user" ? "user" : "ai");
 const bubble = document.createElement("div");
 bubble.className = "bubble";
 if (role === "user") {
  bubble.textContent = text;
 } else {
  bubble.classList.add("message-content");
  bubble.innerHTML = renderMarkdown(text);
 }
 wrapper.appendChild(bubble);
 chat.appendChild(wrapper);
 chat.scrollTop = chat.scrollHeight;
 if (save) {
  history.push({ role, content: text });
  saveHistory();
 }
 return wrapper;
}
// =====================================
// COPY CODE
// =====================================
chat.addEventListener("click", async event => {
 const button = event.target.closest(".copy-btn");
 if (!button) return;
 const code = button
  .closest(".code-card")
  ?.querySelector("pre code")?.innerText;
 if (code === undefined) return;
 try {
  await navigator.clipboard.writeText(code);
  button.textContent = "Đã sao chép!";
 } catch {
  const area = document.createElement("textarea");
  area.value = code;
  document.body.appendChild(area);
  area.select();
  try {
   document.execCommand("copy");
   button.textContent = "Đã sao chép!";
  } catch {
   button.textContent = "Copy thất bại";
  }
  area.remove();
 }
 setTimeout(() => button.textContent = "Copy code", 1500);
});
// =====================================
// TYPING INDICATOR
// =====================================
function showTyping() {
 const el = document.createElement("div");
 el.className = "typing";
 el.id = "typing";
 el.textContent = "Nova AI đang suy nghĩ...";
 chat.appendChild(el);
 chat.scrollTop = chat.scrollHeight;
}
function removeTyping() {
 document.getElementById("typing")?.remove();
}
// =====================================
// SEND MESSAGE
// =====================================
async function sendMessage() {
 const text = input.value.trim();
 if (!text || busy) return;
 const key = getAPIKey();
 if (!key) {
  openSettings();
  alert("Bạn cần nhập API Key Groq trước.");
  return;
 }
 busy = true;
 send.disabled = true;
 addMessage("user", text);
 input.value = "";
 resizeInput(input);
 showTyping();
 try {
  const messages = [
   { role: "system", content: SYSTEM_PROMPT },
   ...history.slice(0, -1).map(item => ({
    role: item.role === "ai" ? "assistant" : "user",
    content: item.content
   }))
  ];
  const response = await fetch(API_URL, {
   method: "POST",
   headers: {
    "Content-Type": "application/json",
    "Authorization": "Bearer " + key
   },
   body: JSON.stringify({
    model: AI_MODEL,
    messages: messages,
    temperature: 0.7,
    max_completion_tokens: 8192,
    reasoning_effort: "medium"
   })
  });
  let data;
  try {
   data = await response.json();
  } catch {
   throw new Error("Không đọc được phản hồi từ máy chủ.");
  }
  if (!response.ok) {
   throw new Error(
    data.error?.message ||
    "API lỗi HTTP " + response.status
   );
  }
  const answer =
   data.choices?.[0]?.message?.content;
  if (!answer || !answer.trim()) {
   throw new Error("AI trả về nội dung trống.");
  }
  removeTyping();
  addMessage("ai", answer);
 } catch (error) {
  removeTyping();
  const errorBox = document.createElement("div");
  errorBox.className = "message ai";
  const bubble = document.createElement("div");
  bubble.className = "bubble error";
  bubble.textContent = "Lỗi: " + error.message;
  errorBox.appendChild(bubble);
  chat.appendChild(errorBox);
  chat.scrollTop = chat.scrollHeight;
 } finally {
  removeTyping();
  busy = false;
  send.disabled = false;
  input.focus();
 }
}
// =====================================
// INPUT
// =====================================
function resizeInput(el) {
 el.style.height = "auto";
 el.style.height = Math.min(el.scrollHeight, 130) + "px";
}
function handleKey(event) {
 if (event.key === "Enter" && !event.shiftKey) {
  event.preventDefault();
  sendMessage();
 }
}
// =====================================
// CLEAR CHAT
// =====================================
function clearChat() {
 if (!confirm("Bạn có muốn xóa toàn bộ lịch sử chat?")) return;
 history = [];
 saveHistory();
 chat.innerHTML = `
  <div class="welcome" id="welcome">
   <h1>Nova AI Pro</h1>
   <p>Trợ lý lập trình, phân tích code và nghiên cứu bảo mật.</p>
  </div>
 `;
}
// =====================================
// RESTORE HISTORY
// =====================================
history.forEach(item => {
 if (!item || !["user", "ai"].includes(item.role)) return;
 addMessage(item.role, String(item.content || ""), false);
});
</script>
</body>
</html>
