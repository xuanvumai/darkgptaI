<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSysteming, sans-serif;
    background: #0b0d12;
    color: #f1f1f1;
}

.app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
}

header {
    height: 60px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-bottom: 1px solid #22252d;
    background: #11131a;
}

.logo {
    font-size: 19px;
    font-weight: 800;
    color: #8b9cff;
}

.status {
    margin-left: auto;
    font-size: 12px;
    color: #8a8e9b;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    padding-bottom: 30px;
}

.welcome {
    text-align: center;
    margin: 70px auto 30px;
    max-width: 500px;
}

.welcome h1 {
    font-size: 29px;
    background: linear-gradient(90,#8b9cff,#c59aff);
    -webkit-background-clip: text;
    color: transparent;
}

.welcome p {
    color: #858997;
    font-size: 14px;
}

.message {
    margin: 18px 0;
    display: flex;
}

.message.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 90%;
    padding: 13px 15px;
    border-radius: 17px;
    line-height: 1.6;
    font-size: 14px;
    overflow-wrap: anywhere;
}

.user .bubble {
    background: #303b67;
    border-bottom-right-radius: 5px;
}

.ai .bubble {
    background: #171a22;
    border: 1px solid #252933;
    border-bottom-left-radius: 5px;
}

.bubble pre {
    background: #090b10;
    padding: 12px;
    border-radius: 10px;
    overflow-x: auto;
    white-space: pre;
}

.bubble code {
    font-family: monospace;
    font-size: 13px;
}

.copy {
    margin-top: 7px;
    background: #282c35;
    color: #ddd;
    border: none;
    padding: 7px 11px;
    border-radius: 7px;
}

.typing {
    color: #8d93a3;
    font-size: 13px;
    margin: 10px;
}

.footer {
    padding: 10px 12px;
    background: #101219;
    border-top: 1px solid #252832;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
}

.input-box {
    display: flex;
    align-items: flex-end;
    background: #1a1d25;
    border: 1px solid #303440;
    border-radius: 17px;
    padding: 8px;
    gap: 8px;
}

textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 15px;
    padding: 9px;
    max-height: 120px;
}

textarea::placeholder {
    color: #777d8b;
}

.send {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 12px;
    background: #7587ff;
    color: white;
    font-size: 20px;
}

.send:disabled {
    opacity: .4;
}

.note {
    text-align: center;
    color: #656a76;
    font-size: 10px;
    margin-top: 8px;
}

.clear {
    background: transparent;
    color: #8c91a0;
    border: none;
    font-size: 12px;
    margin-left: 12px;
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">✦ Nova AI</div>
    <div class="status">AI Assistant</div>
    <button class="clear" onclick="clearChat()">Xóa chat</button>
</header>

<div class="chat" id="chat">

    <div class="welcome" id="welcome">
        <h1>Xin chào 👋</h1>
        <p>Tôi có thể giúp bạn lập trình, phân tích lỗi, giải thích và viết code.</p>
    </div>

</div>

<div class="footer">
    <div class="input-box">
        <textarea
            id="input"
            rows="1"
            placeholder="Nhắn tin cho Nova AI..."
            onkeydown="handleKey(event)"
        ></textarea>

        <button class="send" id="send" onclick="sendMessage()">↑</button>
    </div>

    <div class="note">
        Nova AI có thể mắc lỗi. Hãy kiểm tra thông tin quan trọng.
    </div>
</div>

</div>

<script>

// =====================================
// CẤU HÌNH API
// =====================================

// Nhập API Key của nhà cung cấp AI tương thích OpenAI.
// Không nên để API Key thật trong website công khai.
const API_KEY = "";
const API_URL = "https://api.openai.com/v1/chat/completions";
const MODEL = "gpt-4o-mini";

// =====================================

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");

let history = JSON.parse(localStorage.getItem("nova_history") || "[]");

function saveHistory() {
    localStorage.setItem("nova_history", JSON.stringify(history));
}

function escapeHTML(text) {
    return text.replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[char];
    });
}

function formatMessage(text) {
    let safe = escapeHTML(text);

    safe = safe.replace(
        /```([\w+-]*)\n([\s\S]*?)```/g,
        function(match, language, code) {
            return `<pre><code>${code}</code></pre>
            <button class="copy" onclick="copyCode(this)">Copy code</button>`;
        }
    );

    safe = safe.replace(/\n/g, "<br>");

    return safe;
}

function addMessage(role, text, save = true) {
    document.getElementById("welcome")?.remove();

    const wrapper = document.createElement("div");
    wrapper.className = "message " + (role === "user" ? "user" : "ai");

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = formatMessage(text);

    wrapper.appendChild(bubble);
    chat.appendChild(wrapper);

    chat.scrollTop = chat.scrollHeight;

    if (save) {
        history.push({ role, content: text });
        saveHistory();
    }
}

function showTyping() {
    const el = document.createElement("div");
    el.className = "typing";
    el.id = "typing";
    el.innerText = "Nova AI đang suy nghĩ...";
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
    document.getElementById("typing")?.remove();
}

async function sendMessage() {
    const text = input.value.trim();

    if (!text || send.disabled) return;

    if (!API_KEY) {
        alert("Bạn chưa nhập API KEY trong phần cấu hình.");
        return;
    }

    input.value = "";
    input.style.height = "auto";

    addMessage("user", text);

    send.disabled = true;
    showTyping();

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + API_KEY
            },
            body: JSON.stringify({
                model: MODEL,
                messages: [
                    {
                        role: "system",
                        content: `Bạn là Nova AI, một trợ lý thông minh.
Trả lời bằng tiếng Việt, rõ ràng, tự nhiên và chi tiết.
Khi người dùng yêu cầu code, hãy viết code hoàn chỉnh,
giải thích vị trí sử dụng và cách chạy.
Nếu người dùng gửi lỗi, hãy phân tích nguyên nhân,
đưa ra cách sửa cụ thể và code sửa nếu cần.`
                    },
                    ...history.map(item => ({
                        role: item.role === "ai" ? "assistant" : item.role,
                        content: item.content
                    }))
                ],
                temperature: 0.7
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error?.message || "API gặp lỗi");
        }

        const answer = data.choices?.[0]?.message?.content
            || "AI không trả về nội dung.";

        removeTyping();
        addMessage("ai", answer);

    } catch (error) {
        removeTyping();
        addMessage("ai", "Lỗi kết nối: " + error.message);
    }

    send.disabled = false;
    input.focus();
}

function handleKey(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
}

function copyCode(button) {
    const code = button.previousElementSibling.querySelector("code");

    if (code) {
        navigator.clipboard.writeText(code.innerText);
        button.innerText = "Đã sao chép!";
        setTimeout(() => button.innerText = "Copy code", 1500);
    }
}

function clearChat() {
    if (!confirm("Xóa toàn bộ cuộc trò chuyện?")) return;

    history = [];
    saveHistory();
    chat.innerHTML = `
        <div class="welcome" id="welcome">
            <h1>Xin chào 👋</h1>
            <p>Tôi có thể giúp bạn lập trình, phân tích lỗi, giải thích và viết code.</p>
        </div>
    `;
}

// Khôi phục tin nhắn cũ
history.forEach(item => {
    addMessage(item.role, item.content, false);
});

</script>

</body>
</html>
